name: Trigger auto deployment for carstop-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ hw2 ]
    paths:
    - '**'
    - '.github/workflows/carstop-backend-AutoDeployTrigger-e27bcf67-2edb-4b1e-8462-18f3288941b0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CARSTOPBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CARSTOPBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CARSTOPBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: carstopacr.azurecr.io
          registryUsername: ${{ secrets.CARSTOPBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CARSTOPBACKEND_REGISTRY_PASSWORD }}
          containerAppName: carstop-backend
          resourceGroup: Hw2
          imageToBuild: carstopacr.azurecr.io/carstop-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


