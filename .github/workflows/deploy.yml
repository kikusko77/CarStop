name: Deploy Backend

  on:
    push:
      branches: [main, hw2]
    workflow_dispatch:

  permissions:
    contents: read

  env:
    REGISTRY: carstopacr.azurecr.io
    IMAGE_NAME: carstop-backend
    RG: Hw2
    APP_NAME: carstop-backend

  jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: docker/setup-buildx-action@v3

        - name: Log in to ACR
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ secrets.ACR_USERNAME }}
            password: ${{ secrets.ACR_PASSWORD }}

        - name: Build and push image
          uses: docker/build-push-action@v5
          with:
            context: .
            platforms: linux/amd64
            push: true
            tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

        - name: Deploy to Container App via ARM REST API
          run: |
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RG }}/providers/Microsoft.App/containerApps/${{
  env.APP_NAME }}?api-version=2023-05-01" \
              -d "{\"properties\":{\"template\":{\"containers\":[{\"name\":\"${{ env.APP_NAME }}\",\"image\":\"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha
  }}\"}]}}}"
